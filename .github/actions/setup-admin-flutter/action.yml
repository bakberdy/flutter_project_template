name: Set up Admin Flutter
description: Set up the pinned Flutter SDK and workspace dependencies for Admin CI.

runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version-file: .fvmrc
        cache: true
        pub-cache: true

    - name: Restore Admin workspace metadata
      id: admin-workspace-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
      with:
        path: |
          .dart_tool
          packages/project_lints/.dart_tool
        key: admin-workspace-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.fvmrc', 'pubspec.yaml', 'pubspec.lock', 'apps/admin_app/pubspec.yaml', 'modules/admin_auth/pubspec.yaml', 'modules/admin_preferences/pubspec.yaml', 'modules/admin_profile/pubspec.yaml', 'modules/admin_users/pubspec.yaml', 'modules/core/pubspec.yaml', 'modules/design_system/pubspec.yaml', 'modules/shared/pubspec.yaml', 'packages/project_lints/pubspec.yaml', 'packages/project_lints/pubspec.lock') }}

    - name: Resolve Admin workspace dependencies
      if: steps.admin-workspace-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        flutter pub get
        dart pub get --directory packages/project_lints
