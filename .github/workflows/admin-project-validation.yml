name: Admin Project Validation

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Full source commit SHA"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: admin-project-validation-${{ github.ref }}-${{ inputs.source_sha }}
  cancel-in-progress: true

jobs:
  validation:
    name: Admin Application Quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_sha must be a full lowercase Git SHA."
            exit 1
          }
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git show --check --format= HEAD

      - name: Set up Admin Flutter once
        uses: ./.github/actions/setup-admin-flutter

      - name: Run Admin static checks in parallel
        run: |
          set -euo pipefail
          logs="${RUNNER_TEMP}/admin-static-checks"
          mkdir -p "${logs}"

          (
            dart format --output=none --set-exit-if-changed \
              apps/admin_app \
              modules/admin_auth \
              modules/admin_preferences \
              modules/admin_profile \
              modules/admin_users \
              modules/core \
              modules/design_system \
              modules/shared
          ) >"${logs}/format.log" 2>&1 &
          format_pid=$!

          (
            packages=(
              apps/admin_app
              modules/admin_auth
              modules/admin_preferences
              modules/admin_profile
              modules/admin_users
              modules/core
              modules/design_system
              modules/shared
            )
            analyze_pids=()
            for package in "${packages[@]}"; do
              (
                cd "${package}"
                dart analyze
              ) >"${logs}/analyze-${package//\//-}.log" 2>&1 &
              analyze_pids+=("$!")
            done

            analyze_result=0
            for index in "${!analyze_pids[@]}"; do
              package="${packages[${index}]}"
              if wait "${analyze_pids[${index}]}"; then
                echo "==> ${package}: analyze passed"
              else
                echo "==> ${package}: analyze failed"
                analyze_result=1
              fi
              cat "${logs}/analyze-${package//\//-}.log"
            done
            exit "${analyze_result}"
          ) >"${logs}/analyze.log" 2>&1 &
          analyze_pid=$!

          (
            dart run tool/validation/check_hardcoded_ui_strings.dart \
              --root apps/admin_app \
              --root modules/admin_auth \
              --root modules/admin_preferences \
              --root modules/admin_profile \
              --root modules/admin_users \
              --root modules/core \
              --root modules/design_system \
              --root modules/shared
          ) >"${logs}/hardcoded.log" 2>&1 &
          hardcoded_pid=$!

          result=0
          for check in format analyze hardcoded; do
            case "${check}" in
              format) pid="${format_pid}" ;;
              analyze) pid="${analyze_pid}" ;;
              hardcoded) pid="${hardcoded_pid}" ;;
            esac
            if wait "${pid}"; then
              echo "::notice::${check} check passed"
            else
              echo "::error::${check} check failed"
              result=1
            fi
            echo "::group::${check} output"
            cat "${logs}/${check}.log"
            echo "::endgroup::"
          done
          exit "${result}"

      - name: Run Admin tests and Web build in parallel
        run: |
          set -euo pipefail
          logs="${RUNNER_TEMP}/admin-runtime-checks"
          mkdir -p "${logs}"

          (
            packages=(
              apps/admin_app
              modules/admin_auth
              modules/admin_preferences
              modules/admin_profile
              modules/admin_users
              modules/core
              modules/design_system
              modules/shared
            )
            for package in "${packages[@]}"; do
              if [[ ! -d "${package}/test" ]]; then
                echo "==> ${package}: no tests"
                continue
              fi
              echo "==> flutter test ${package}"
              flutter test "${package}"
            done
          ) >"${logs}/tests.log" 2>&1 &
          tests_pid=$!

          (
            cd apps/admin_app
            flutter build web --release \
              --dart-define=API_URL=https://admin-ci.invalid \
              --dart-define=ENVIRONMENT=ci \
              --dart-define=ENABLE_LOGGING=false \
              --dart-define=ENABLE_ANALYTICS=false \
              --dart-define=ENABLE_CRASHLYTICS=false \
              --dart-define=CONNECT_TIMEOUT_SECONDS=30 \
              --dart-define=RECEIVE_TIMEOUT_SECONDS=30 \
              --dart-define=SEND_TIMEOUT_SECONDS=30
          ) >"${logs}/web-build.log" 2>&1 &
          web_build_pid=$!

          result=0
          if wait "${tests_pid}"; then
            echo "::notice::Admin tests passed"
          else
            echo "::error::Admin tests failed"
            result=1
          fi
          echo "::group::Admin tests output"
          cat "${logs}/tests.log"
          echo "::endgroup::"

          if wait "${web_build_pid}"; then
            echo "::notice::Admin Web build passed"
          else
            echo "::error::Admin Web build failed"
            result=1
          fi
          echo "::group::Admin Web build output"
          cat "${logs}/web-build.log"
          echo "::endgroup::"
          exit "${result}"

      - name: Smoke test built Admin Web
        run: |
          set -euo pipefail
          build_dir="apps/admin_app/build/web"
          test -s "${build_dir}/index.html"
          test -s "${build_dir}/flutter_bootstrap.js"
          test -s "${build_dir}/main.dart.js"

          python3 -m http.server 8080 --directory "${build_dir}" \
            >"${RUNNER_TEMP}/admin-web-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..10}; do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:8080/index.html" \
              --output "${RUNNER_TEMP}/admin-index.html"; then
              break
            fi
            if [[ "${attempt}" -eq 10 ]]; then
              cat "${RUNNER_TEMP}/admin-web-server.log"
              exit 1
            fi
            sleep 1
          done

          grep -q "flutter_bootstrap.js" "${RUNNER_TEMP}/admin-index.html"
          curl --fail --silent --show-error \
            "http://127.0.0.1:8080/flutter_bootstrap.js" \
            --output /dev/null
          curl --fail --silent --show-error \
            "http://127.0.0.1:8080/main.dart.js" \
            --output /dev/null
