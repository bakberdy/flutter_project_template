name: Admin Project Validation

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Full source commit SHA"
        required: true
        type: string
    outputs:
      status:
        description: "Admin quality gate result"
        value: ${{ jobs.quality-gate.outputs.status }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: admin-project-validation-${{ github.ref }}-${{ inputs.source_sha }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Admin Quality Source Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_sha must be a full lowercase Git SHA."
            exit 1
          }
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git show --check --format= HEAD

  dependencies:
    name: Admin Quality Dependencies
    needs: [source-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Warm Admin Flutter and dependency caches
        uses: ./.github/actions/setup-admin-flutter

  formatting:
    name: Admin Formatting
    needs: [dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Restore Admin Flutter and dependencies
        uses: ./.github/actions/setup-admin-flutter

      - name: Check Admin formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            apps/admin_app \
            modules/admin_auth \
            modules/admin_preferences \
            modules/admin_profile \
            modules/admin_users \
            modules/core \
            modules/design_system \
            modules/shared

  analysis:
    name: Admin Analysis
    needs: [dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Restore Admin Flutter and dependencies
        uses: ./.github/actions/setup-admin-flutter

      - name: Analyze Admin dependency scope
        run: |
          set -euo pipefail
          packages=(
            apps/admin_app
            modules/admin_auth
            modules/admin_preferences
            modules/admin_profile
            modules/admin_users
            modules/core
            modules/design_system
            modules/shared
          )
          for package in "${packages[@]}"; do
            echo "::group::dart analyze ${package}"
            (
              cd "${package}"
              dart analyze
            )
            echo "::endgroup::"
          done

  ui-string-policy:
    name: Admin UI String Policy
    needs: [dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Restore Admin Flutter and dependencies
        uses: ./.github/actions/setup-admin-flutter

      - name: Check Admin hardcoded UI strings
        run: |
          dart run tool/validation/check_hardcoded_ui_strings.dart \
            --root apps/admin_app \
            --root modules/admin_auth \
            --root modules/admin_preferences \
            --root modules/admin_profile \
            --root modules/admin_users \
            --root modules/core \
            --root modules/design_system \
            --root modules/shared

  unit-tests:
    name: Admin Unit Tests
    needs: [dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Restore Admin Flutter and dependencies
        uses: ./.github/actions/setup-admin-flutter

      - name: Test Admin dependency scope
        run: |
          set -euo pipefail
          packages=(
            apps/admin_app
            modules/admin_auth
            modules/admin_preferences
            modules/admin_profile
            modules/admin_users
            modules/core
            modules/design_system
            modules/shared
          )
          for package in "${packages[@]}"; do
            if [[ ! -d "${package}/test" ]]; then
              echo "==> ${package}: no tests"
              continue
            fi
            echo "::group::flutter test ${package}"
            flutter test "${package}"
            echo "::endgroup::"
          done

  web-build:
    name: Admin Web Build
    needs: [dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Restore Admin Flutter and dependencies
        uses: ./.github/actions/setup-admin-flutter

      - name: Build Admin Web with synthetic configuration
        working-directory: apps/admin_app
        run: |
          flutter build web --release \
            --dart-define=API_URL=https://admin-ci.invalid \
            --dart-define=ENVIRONMENT=ci \
            --dart-define=ENABLE_LOGGING=false \
            --dart-define=ENABLE_ANALYTICS=false \
            --dart-define=ENABLE_CRASHLYTICS=false \
            --dart-define=CONNECT_TIMEOUT_SECONDS=30 \
            --dart-define=RECEIVE_TIMEOUT_SECONDS=30 \
            --dart-define=SEND_TIMEOUT_SECONDS=30

      - name: Upload Admin Web quality artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: admin-quality-web-${{ inputs.source_sha }}
          path: apps/admin_app/build/web
          if-no-files-found: error
          retention-days: 1

  web-smoke:
    name: Admin Web Smoke
    needs: [web-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Admin Web quality artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: admin-quality-web-${{ inputs.source_sha }}
          path: build/web

      - name: Smoke test built Admin Web
        run: |
          set -euo pipefail
          build_dir="build/web"
          test -s "${build_dir}/index.html"
          test -s "${build_dir}/flutter_bootstrap.js"
          test -s "${build_dir}/main.dart.js"

          python3 -m http.server 8080 --directory "${build_dir}" \
            >"${RUNNER_TEMP}/admin-web-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..10}; do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:8080/index.html" \
              --output "${RUNNER_TEMP}/admin-index.html"; then
              break
            fi
            if [[ "${attempt}" -eq 10 ]]; then
              cat "${RUNNER_TEMP}/admin-web-server.log"
              exit 1
            fi
            sleep 1
          done

          grep -q "flutter_bootstrap.js" "${RUNNER_TEMP}/admin-index.html"
          curl --fail --silent --show-error \
            "http://127.0.0.1:8080/flutter_bootstrap.js" \
            --output /dev/null
          curl --fail --silent --show-error \
            "http://127.0.0.1:8080/main.dart.js" \
            --output /dev/null

  quality-gate:
    name: Admin Quality Gate
    if: always()
    needs:
      - source-contract
      - dependencies
      - formatting
      - analysis
      - ui-string-policy
      - unit-tests
      - web-build
      - web-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - name: Require all Admin quality checks
        id: result
        env:
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          SOURCE_CONTRACT_RESULT: ${{ needs.source-contract.result }}
          UI_STRING_POLICY_RESULT: ${{ needs.ui-string-policy.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          WEB_BUILD_RESULT: ${{ needs.web-build.result }}
          WEB_SMOKE_RESULT: ${{ needs.web-smoke.result }}
        run: |
          set -euo pipefail
          results=(
            "source-contract=${SOURCE_CONTRACT_RESULT}"
            "dependencies=${DEPENDENCIES_RESULT}"
            "formatting=${FORMATTING_RESULT}"
            "analysis=${ANALYSIS_RESULT}"
            "ui-string-policy=${UI_STRING_POLICY_RESULT}"
            "unit-tests=${UNIT_TESTS_RESULT}"
            "web-build=${WEB_BUILD_RESULT}"
            "web-smoke=${WEB_SMOKE_RESULT}"
          )
          failed=0
          for result in "${results[@]}"; do
            name="${result%%=*}"
            status="${result#*=}"
            if [[ "${status}" == "success" ]]; then
              echo "::notice::${name} passed"
            else
              echo "::error::${name} finished with ${status}"
              failed=1
            fi
          done
          if [[ "${failed}" -ne 0 ]]; then
            exit 1
          fi
          echo "status=success" >>"${GITHUB_OUTPUT}"
