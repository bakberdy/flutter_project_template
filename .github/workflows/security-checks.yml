name: Security Checks

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Full source commit SHA"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repository-security:
    name: Repository Security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out approved repository history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_sha must be a full lowercase Git SHA."
            exit 1
          }
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Reject tracked ignored files
        run: |
          set -euo pipefail
          tracked_ignored="$(git ls-files --cached --ignored \
            --exclude-standard)"
          if [[ -n "${tracked_ignored}" ]]; then
            echo "::error::Ignored files are already tracked:"
            printf '%s\n' "${tracked_ignored}"
            exit 1
          fi

      - name: Install pinned repository scanners once
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
          OSV_SCANNER_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
          OSV_SCANNER_VERSION: 2.3.8
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/repository-security-tools"
          mkdir -p "${tools_dir}/actionlint"

          gitleaks_archive="${tools_dir}/gitleaks.tar.gz"
          osv_scanner="${tools_dir}/osv-scanner"
          actionlint_archive="${tools_dir}/actionlint.tar.gz"

          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${gitleaks_archive}" &
          gitleaks_download_pid=$!

          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            --output "${osv_scanner}" &
          osv_download_pid=$!

          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "${actionlint_archive}" &
          actionlint_download_pid=$!

          wait "${gitleaks_download_pid}"
          wait "${osv_download_pid}"
          wait "${actionlint_download_pid}"

          echo "${GITLEAKS_SHA256}  ${gitleaks_archive}" |
            sha256sum --check --status
          echo "${OSV_SCANNER_SHA256}  ${osv_scanner}" |
            sha256sum --check --status
          echo "${ACTIONLINT_SHA256}  ${actionlint_archive}" |
            sha256sum --check --status

          tar --extract --gzip --file "${gitleaks_archive}" \
            --directory "${tools_dir}" gitleaks
          chmod 0755 "${osv_scanner}"
          tar --extract --gzip --file "${actionlint_archive}" \
            --directory "${tools_dir}/actionlint"

      - name: Scan complete repository history for secrets
        run: |
          "${RUNNER_TEMP}/repository-security-tools/gitleaks" git \
            --redact \
            --no-banner \
            --verbose \
            .

      - name: Audit complete locked dependency graph
        run: |
          "${RUNNER_TEMP}/repository-security-tools/osv-scanner" \
            scan source -r .

      - name: Validate all GitHub workflow syntax and expressions
        run: |
          "${RUNNER_TEMP}/repository-security-tools/actionlint/actionlint" \
            -color \
            .github/workflows/*.yml
