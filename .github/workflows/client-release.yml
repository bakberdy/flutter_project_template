name: Client Release

on:
  push:
    tags:
      - "client-development-v*"
      - "client-production-v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-contract:
    name: Client Release Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      environment: ${{ steps.contract.outputs.environment }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
    steps:
      - name: Check out release history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Client release tag
        id: contract
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" =~ ^client-(development|production)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            environment="${BASH_REMATCH[1]}"
            release_version="${BASH_REMATCH[2]}"
          else
            echo "::error::Tag must match client-<development|production>-v<MAJOR.MINOR.PATCH>."
            exit 1
          fi

          git fetch --no-tags origin "${DEFAULT_BRANCH}"
          test "${SOURCE_SHA}" = "$(git rev-parse "origin/${DEFAULT_BRANCH}")" || {
            echo "::error::Client release tag must point to current ${DEFAULT_BRANCH} HEAD."
            exit 1
          }

          app_version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' \
            apps/client_app/pubspec.yaml)"
          test "${app_version}" = "${release_version}" || {
            echo "::error::Client tag version must match apps/client_app/pubspec.yaml."
            exit 1
          }
          {
            echo "environment=${environment}"
            echo "source_sha=${SOURCE_SHA}"
          } >>"${GITHUB_OUTPUT}"

  deploy-android:
    name: Deploy Android
    needs: [release-contract]
    uses: ./.github/workflows/client-android-deploy.yml
    with:
      flavor: ${{ needs.release-contract.outputs.environment }}
      ref: ${{ needs.release-contract.outputs.source_sha }}

  deploy-ios:
    name: Deploy iOS
    needs: [release-contract]
    uses: ./.github/workflows/client-ios-deploy.yml
    with:
      flavor: ${{ needs.release-contract.outputs.environment }}
      ref: ${{ needs.release-contract.outputs.source_sha }}

  client-release-gate:
    name: Client Release Gate
    if: always()
    needs:
      - release-contract
      - deploy-android
      - deploy-ios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both store deployments
        env:
          ANDROID_RESULT: ${{ needs.deploy-android.result }}
          CONTRACT_RESULT: ${{ needs.release-contract.result }}
          IOS_RESULT: ${{ needs.deploy-ios.result }}
        run: |
          set -euo pipefail
          if [[ "${CONTRACT_RESULT}" != "success" ||
                "${ANDROID_RESULT}" != "success" ||
                "${IOS_RESULT}" != "success" ]]; then
            echo "::error::Client release did not complete on both platforms."
            exit 1
          fi
